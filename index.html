<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ella’s Collection | Dress well, live better</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3d8b;--green:#1fd08a;--red:#ff4040;--ink:#0c080a;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--txt:#fff6fa;--mut:#dcc6d1}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:var(--txt);background:var(--ink);min-height:100vh;padding-bottom:40px}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45vw 45vw at 8% 4%,rgba(255,61,139,.6),transparent),radial-gradient(50vw 50vw at 98% 35%,rgba(31,208,138,.42),transparent),radial-gradient(45vw 45vw at 25% 100%,rgba(255,64,64,.5),transparent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px}
.wrap{max-width:1150px;margin:0 auto;padding:0 12px}
header{position:sticky;top:0;z-index:5;padding:10px 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px}
.brand{font-weight:800;font-size:1.1rem;letter-spacing:.2px;flex:1 1 auto}
.logo{display:block;height:54px;width:auto}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--mut)}
.ibtn{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:600}
.ibtn b{background:var(--red);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:.8rem}
.search{flex:1 1 100%;display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.12)}
.search input{flex:1;background:none;border:0;padding:12px 14px;min-width:0}
.search input::placeholder{color:var(--mut)}
.search button{background:var(--pink);padding:0 20px;font-weight:700}
.hero{margin:10px 0;padding:26px 20px;background:linear-gradient(120deg,rgba(255,61,139,.35),rgba(31,208,138,.2),rgba(255,64,64,.3))}
.hero h1{font-size:clamp(1.7rem,6vw,3rem);line-height:1.1;font-weight:800;max-width:14ch}
.hero p{margin:10px 0 16px;color:var(--mut);max-width:42ch}
.cta{background:var(--green);color:#04170f;font-weight:700;padding:11px 20px;border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}
.chip{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:600}
.chip.on{background:var(--pink);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{overflow:hidden;display:flex;flex-direction:column}
.tile{aspect-ratio:1/1.05;display:grid;place-items:center;font-size:3.4rem;position:relative;cursor:pointer;background-size:cover;background-position:center}
.tag{position:absolute;left:8px;top:8px;background:var(--red);font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px}
.heart{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.35);border-radius:50%;width:34px;height:34px;font-size:1.05rem}
.heart.on{color:var(--pink)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:600;font-size:.95rem;cursor:pointer}
.pr{font-weight:800;color:var(--green);font-size:1.05rem}
.pr s{color:var(--mut);font-weight:400;font-size:.8rem;margin-left:6px}
.st{color:#ffc24b;font-size:.85rem}.st i{color:var(--mut);font-style:normal}
.add{margin-top:auto;background:var(--pink);border-radius:10px;padding:9px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;color:var(--mut)}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
@media(min-width:700px){#ov{align-items:center}}
#m{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px;background:rgba(30,16,24,.78)}
#m h2{margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.sz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.sz button{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.sz button.on{background:var(--green);color:#04170f;border-color:var(--green)}
.f{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.f input,.f select{background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
.f select option{color:#000}
.wa{display:block;text-align:center;background:var(--green);color:#04170f;font-weight:700;border-radius:12px;padding:12px;text-decoration:none;width:100%}
.ghost{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;font-weight:600;margin-top:8px}
.qty button{background:var(--glass);border:1px solid var(--line);border-radius:8px;width:30px;height:30px}
.note{color:var(--mut);font-size:.85rem;margin-top:8px}
.wafab{position:fixed;right:14px;bottom:14px;z-index:6;background:var(--green);color:#04170f;border-radius:99px;padding:12px 18px;font-weight:700;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
footer{text-align:center;color:var(--mut);padding:24px 0 60px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <nav class="chips" id="chips" aria-label="Categories"></nav>

</main>

<script>
const WA="233531499359";
const CATS=["All","Dresses","Women","Shirts","Trousers","Shoes","Shower gel","Saved"];
const TT="https://www.tiktok.com/@shamsiya672";/* paste Ella’s TikTok link between the quotes */
const ICON={Dresses:"👗",Women:"👚",Shirts:"👔",Trousers:"👖",Shoes:"👟","Shower gel":"🧴"};
const HUE={Dresses:"#ff3d8b",Women:"#c2326f",Shirts:"#1fd08a",Trousers:"#2a7d62",Shoes:"#ff4040","Shower gel":"#1fa86e"};
const CL=["S","M","L","XL"],SH=["38","39","40","41","42","43"];
/* SAMPLE products. Replace with real ones. Add a photo with img:"photos/name.jpg" */
const P=[
{id:1,n:"Floral Wrap Dress",c:"Dresses",p:180,o:230,s:CL,r:4.8,v:32,t:"Sale"},
{id:2,n:"Satin Evening Gown",c:"Dresses",p:320,s:CL,r:4.9,v:18,t:"New"},
{id:3,n:"Ankara Peplum Dress",c:"Dresses",p:210,s:CL,r:4.7,v:41},
{id:4,n:"Ladies Chiffon Blouse",c:"Women",p:95,o:120,s:CL,r:4.5,v:27,t:"Sale"},
{id:5,n:"High Waist Skirt Set",c:"Women",p:240,s:CL,r:4.6,v:15},
{id:6,n:"Casual Linen Shirt",c:"Shirts",p:110,s:CL,r:4.4,v:22},
{id:7,n:"Short Sleeve Polo",c:"Shirts",p:85,s:CL,r:4.6,v:38,t:"New"},
{id:8,n:"Slim Fit Chinos",c:"Trousers",p:150,o:180,s:CL,r:4.5,v:29,t:"Sale"},
{id:9,n:"Straight Leg Trousers",c:"Trousers",p:135,s:CL,r:4.3,v:12},
{id:10,n:"Leather Slip-on Shoes",c:"Shoes",p:260,s:SH,r:4.7,v:33},
{id:11,n:"Ladies Block Heels",c:"Shoes",p:220,o:260,s:SH,r:4.8,v:25,t:"Sale"},
{id:12,n:"Everyday Sneakers",c:"Shoes",p:190,s:SH,r:4.6,v:44,t:"New"}
];
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cat="All",cart=ls.g("ec_cart",[]),fav=ls.g("ec_fav",[]),sel=null;
const $=id=>document.getElementById(id),money=n=>"GH₵ "+n;
const stars=r=>{const k=Math.round(r);return "★".repeat(k)+"<i>"+"★".repeat(5-k)+"</i>"};
const wa=t=>"https://wa.me/"+WA+"?text="+encodeURIComponent(t);
$("fab").href=wa("Hello Ella’s Collection, I have a question.");

function chips(){$("chips").innerHTML=CATS.map(c=>`<button class="chip ${c===cat?"on":""}" onclick="cat='${c}';chips();render()">${c==="Saved"?"♥ Saved":c}</button>`).join("")}
function tile(p){return p.img?`style="background-image:url('${p.img}')"`:`style="background:linear-gradient(145deg,${HUE[p.c]},#1a0f15)"`}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const L=P.filter(p=>(cat==="All"||(cat==="Saved"?fav.includes(p.id):p.c===cat))&&(!q||(p.n+" "+p.c).toLowerCase().includes(q)));
  $("grid").innerHTML=L.length?L.map(p=>`<article class="card glass">
    <div class="tile" ${tile(p)} onclick="prod(${p.id})">${p.img?"":ICON[p.c]}${p.t?`<span class="tag">${p.t}</span>`:""}
      <button class="heart ${fav.includes(p.id)?"on":""}" aria-label="Save" onclick="event.stopPropagation();heart(${p.id})">♥</button></div>
    <div class="info"><div class="nm" onclick="prod(${p.id})">${p.n}</div>
      <div class="pr">${money(p.p)}${p.o?`<s>${money(p.o)}</s>`:""}</div>
      <div class="st">${stars(p.r)} <span style="color:var(--mut)">(${p.v})</span></div>
      <button class="add" onclick="prod(${p.id})">Choose size</button></div></article>`).join("")
    :`<div class="empty glass">No items match${q?` “${q.replace(/[<>&]/g,"")}”`:""}. Try another word or pick All.</div>`;
}
function heart(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];ls.s("ec_fav",fav);render()}
function openM(h){$("m").innerHTML=h;$("ov").classList.add("open")}
function closeM(){$("ov").classList.remove("open")}
function prod(id){
  const p=P.find(x=>x.id===id);sel={id,s:null};
  openM(`<div class="row"><h2>${p.n}</h2><button class="ibtn" onclick="closeM()">Close</button></div>
  <div class="tile glass" ${tile(p)} style="aspect-ratio:16/9;cursor:default;${p.img?"":""}">${p.img?"":ICON[p.c]}</div>
  <div class="row"><div class="pr">${money(p.p)}${p.o?`<s>${money(p.o)}</s>`:""}</div><div class="st">${stars(p.r)} ${p.r} (${p.v} reviews)</div></div>
  <b>Select size</b><div class="sz">${p.s.map(s=>`<button onclick="pick(this,'${s}')">${s}</button>`).join("")}</div>
  <button class="wa" onclick="addC()">Add to cart</button>
  <a class="ghost wa" style="background:var(--glass);color:var(--txt);margin-top:8px;border:1px solid var(--line)" target="_blank" rel="noopener" href="${wa(`Hello, I'm asking about: ${p.n} (${money(p.p)})`)}">Ask about this on WhatsApp</a>`);
}
function pick(b,s){sel.s=s;[...b.parentNode.children].forEach(x=>x.classList.toggle("on",x===b))}
function addC(){
  if(!sel.s){alert("Please select a size first.");return}
  const f=cart.find(x=>x.id===sel.id&&x.s===sel.s);f?f.q++:cart.push({id:sel.id,s:sel.s,q:1});sv();cartM();
}
function sv(){ls.s("ec_cart",cart);$("cc").textContent=cart.reduce((a,x)=>a+x.q,0)}
function qty(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);sv();cartM()}
function total(){return cart.reduce((a,x)=>a+x.q*P.find(p=>p.id===x.id).p,0)}
function cartM(){
  if(!cart.length){openM(`<div class="row"><h2>Your cart</h2><button class="ibtn" onclick="closeM()">Close</button></div><p class="note">Your cart is empty. Pick an item and a size to add it.</p>`);return}
  openM(`<div class="row"><h2>Your cart</h2><button class="ibtn" onclick="closeM()">Close</button></div>
  ${cart.map((x,i)=>{const p=P.find(y=>y.id===x.id);return `<div class="row"><div><b>${p.n}</b><div class="note">Size ${x.s} · ${money(p.p)}</div></div>
    <div class="qty"><button onclick="qty(${i},-1)" aria-label="Less">−</button> ${x.q} <button onclick="qty(${i},1)" aria-label="More">+</button></div></div>`}).join("")}
  <div class="row"><b>Items total</b><b class="pr">${money(total())}</b></div>
  <p class="note">Delivery fee depends on your location. Ella will confirm it on WhatsApp.</p>
  <div class="f"><input id="cn" placeholder="Your name" autocomplete="name"><input id="cp" type="tel" placeholder="Your phone number" autocomplete="tel">
  <input id="cl" placeholder="Delivery location, or write Pickup">
  <select id="cy"><option>MTN Mobile Money</option><option>Telecel Cash</option><option>AT Money</option><option>Cash on delivery</option></select></div>
  <button class="wa" style="margin-top:12px" onclick="order()">Send order on WhatsApp</button>`);
}
function order(){
  const n=$("cn").value.trim(),ph=$("cp").value.trim(),l=$("cl").value.trim();
  if(!n||!ph||!l){alert("Please fill in your name, phone number and location.");return}
  const id="EC"+Math.random().toString(36).slice(2,8).toUpperCase()+Date.now().toString(36).slice(-3).toUpperCase(),items=cart.map(x=>{const p=P.find(y=>y.id===x.id);return `${x.q} x ${p.n}, size ${x.s} (${money(p.p*x.q)})`});
  const o={id,n,ph,l,pay:$("cy").value,items,total:total(),st:"Sent to Ella",d:new Date().toLocaleDateString(),ts:Date.now()};
  const all=ls.g("ec_orders",[]);all.push(o);ls.s("ec_orders",all);window.saveOrder&&window.saveOrder(o);
  const msg=`New order ${id}\nName: ${n}\nPhone: ${ph}\nLocation: ${l}\nPayment: ${o.pay}\n\n${items.join("\n")}\n\nItems total: ${money(o.total)}`;
  cart=[];sv();window.open(wa(msg),"_blank");
  openM(`<h2>Order ${id} sent</h2><p class="note">WhatsApp opened with your order. Send the message to finish. Keep this order number to track it.</p><button class="ghost" onclick="closeM()">Done</button>`);
}
function trackM(r){
  openM(`<div class="row"><h2>Track your order</h2><button class="ibtn" onclick="closeM()">Close</button></div>
  <div class="f"><input id="tn" placeholder="Order number, e.g. ECA1B2C3D4"><button class="wa" onclick="trackR()">Check status</button></div><div id="tr"></div>`);
}
async function trackR(){
  const id=$("tn").value.trim().toUpperCase();let o=null;
  try{o=window.getOrder?await window.getOrder(id):null}catch(e){}
  o=o||ls.g("ec_orders",[]).find(x=>x.id===id);
  $("tr").innerHTML=o?`<div class="glass" style="padding:14px;margin-top:12px"><b>${o.id}</b> · ${o.d}<br><span class="pr">${o.st}</span><p class="note">${o.items.join("<br>")}</p><b>${money(o.total)}</b></div>`
   :`<p class="note">No order found with that number on this phone. Check the number, or ask Ella on WhatsApp.</p>`;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
if(TT){$("tt").href=TT;$("tt").hidden=false}
chips();render();sv();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getFirestore,collection,getDocs,setDoc,getDoc,doc} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyCfJwMJlPpnlpjrRMKBSQpI_vJBIkPiuk8",authDomain:"ella-collection.firebaseapp.com",projectId:"ella-collection",storageBucket:"ella-collection.firebasestorage.app",messagingSenderId:"213380857567",appId:"1:213380857567:web:9fb0763b21a515fbc7336a"}));
/* Shows Ella's products once she has added at least one; until then the sample items stay. */
getDocs(collection(db,"products")).then(s=>{if(!s.empty){P.splice(0,P.length,...s.docs.map(d=>d.data()).sort((a,b)=>b.id-a.id));render()}}).catch(console.error);
window.saveOrder=o=>setDoc(doc(db,"orders",o.id),o).catch(console.error);
window.getOrder=async id=>{const s=await getDoc(doc(db,"orders",id));return s.exists()?s.data():null};
</script>
