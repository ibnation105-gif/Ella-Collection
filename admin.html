<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Ella’s Collection Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Outfit,system-ui,sans-serif;color:#fff6fa;background:#0c080a;min-height:100vh;padding:14px}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45vw 45vw at 8% 4%,rgba(255,61,139,.55),transparent),radial-gradient(50vw 50vw at 98% 40%,rgba(31,208,138,.38),transparent),radial-gradient(45vw 45vw at 25% 100%,rgba(255,64,64,.45),transparent)}
.wrap{max-width:640px;margin:0 auto}
.glass{background:rgba(255,255,255,.09);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:1.4rem;font-weight:800}h2{font-size:1.1rem;margin-bottom:8px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px;margin:5px 0}
select option{color:#000}
label{font-size:.85rem;color:#dcc6d1}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.14)}
.pri{background:#ff3d8b;width:100%;margin-top:8px}.ok{background:#1fd08a;color:#04170f}.bad{background:#ff4040}
:focus-visible{outline:2px solid #1fd08a;outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}.tabs .on{background:#ff3d8b}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.15)}
.it img{width:56px;height:56px;object-fit:cover;border-radius:10px}.it div{flex:1;min-width:0}
.it small,.m{color:#dcc6d1;font-size:.85rem}
#pv{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:6px 0}
.err{color:#ff8a8a;margin-top:8px}.msg{color:#1fd08a;margin:8px 0;font-weight:600}
</style></head><body><div class="wrap">

<div id="login" class="glass"><h1>Ella’s Collection</h1><p class="m">Owner login</p>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="pri" id="lb">Log in</button><p class="err" id="le"></p></div>

<div id="app" hidden>
<div class="row"><h1>Shop admin</h1><button id="out">Log out</button></div>
<div class="tabs"><button id="tp" class="on">Products</button><button id="to">Orders</button></div>

<section id="sp">
<form id="pf" class="glass"><h2 id="ft">Add a product</h2>
<label>Photo</label><input id="ph" type="file" accept="image/*"><img id="pv" alt="Preview" hidden>
<label>Name</label><input id="pn" placeholder="e.g. Floral Wrap Dress" required>
<label>Category</label><select id="pc"><option>Dresses</option><option>Women</option><option>Shirts</option><option>Trousers</option><option>Shoes</option><option>Shower gel</option></select>
<label>Price (GH₵)</label><input id="pp" type="number" min="1" inputmode="numeric" required>
<label>Old price, if on sale (optional)</label><input id="po" type="number" min="0" inputmode="numeric">
<label>Sizes, separated by commas</label><input id="ps" value="S,M,L,XL">
<label>Label</label><select id="pt"><option value="">None</option><option>New</option><option>Sale</option></select>
<button class="pri" type="submit">Save product</button>
<button class="pri" type="button" id="cx" hidden style="background:rgba(255,255,255,.14)">Cancel edit</button>
<p class="msg" id="pm"></p></form>
<div class="glass"><h2>Your products</h2><div id="pl"></div></div>
</section>

<section id="so" hidden><div class="glass"><h2>Orders</h2><div id="ol"></div></div></section>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getFirestore,collection,getDocs,setDoc,deleteDoc,updateDoc,doc} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCfJwMJlPpnlpjrRMKBSQpI_vJBIkPiuk8",authDomain:"ella-collection.firebaseapp.com",projectId:"ella-collection",storageBucket:"ella-collection.firebasestorage.app",messagingSenderId:"213380857567",appId:"1:213380857567:web:9fb0763b21a515fbc7336a"});
const auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SZ={Shoes:"38,39,40,41,42,43","Shower gel":"250ml,500ml"},DEF="S,M,L,XL",STS=["Sent to Ella","Confirmed","Out for delivery","Delivered","Cancelled"];
let img="",editId=null,items={};

$("lb").onclick=async()=>{$("le").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("le").textContent="Wrong email or password. Try again."}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("login").hidden=!!u;$("app").hidden=!u;if(u){loadP();loadO()}});
$("tp").onclick=()=>tab(true);$("to").onclick=()=>tab(false);
function tab(p){$("sp").hidden=!p;$("so").hidden=p;$("tp").classList.toggle("on",p);$("to").classList.toggle("on",!p)}
$("pc").onchange=()=>{$("ps").value=SZ[$("pc").value]||DEF};

$("ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
  img=c.toDataURL("image/jpeg",.72);$("pv").src=img;$("pv").hidden=false};i.src=r.result};r.readAsDataURL(f)};

function reset(){editId=null;img="";$("pf").reset();$("ps").value=DEF;$("pv").hidden=true;$("ft").textContent="Add a product";$("cx").hidden=true}
$("cx").onclick=()=>{reset();$("pm").textContent=""};
$("pf").onsubmit=async e=>{e.preventDefault();$("pm").textContent="";
 const n=$("pn").value.trim(),p=+$("pp").value,old=editId?items[editId]:{};
 if(!n||!p||(!img&&!old.img)){$("pm").textContent="Add a photo, a name and a price.";return}
 const id=editId||Date.now();
 const o={id,n,c:$("pc").value,p,o:+$("po").value||0,s:$("ps").value.split(",").map(x=>x.trim()).filter(Boolean),t:$("pt").value,r:old.r||0,v:old.v||0,img:img||old.img};
 try{await setDoc(doc(db,"products",String(id)),o);reset();$("pm").textContent="Saved. It is now in the shop.";loadP()}
 catch(err){$("pm").textContent="Could not save. Check your internet and try again."}};

async function loadP(){
 const s=await getDocs(collection(db,"products"));items={};s.docs.forEach(d=>items[d.data().id]=d.data());
 const L=Object.values(items).sort((a,b)=>b.id-a.id);
 $("pl").innerHTML=L.length?L.map(p=>`<div class="it"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.n)}</b><br><small>${esc(p.c)} · GH₵ ${esc(p.p)}</small></div>
  <button data-e="${p.id}">Edit</button><button class="bad" data-d="${p.id}">Delete</button></div>`).join(""):`<p class="m">No products yet. Add your first one above.</p>`;
}
$("pl").onclick=async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e){const p=items[b.dataset.e];editId=p.id;img="";$("pn").value=p.n;$("pc").value=p.c;$("pp").value=p.p;$("po").value=p.o||"";$("ps").value=p.s.join(",");$("pt").value=p.t||"";
  $("pv").src=p.img;$("pv").hidden=false;$("ft").textContent="Edit product";$("cx").hidden=false;$("pf").scrollIntoView()}
 if(b.dataset.d&&confirm("Delete this product from the shop?")){await deleteDoc(doc(db,"products",b.dataset.d));loadP()}};

async function loadO(){
 const s=await getDocs(collection(db,"orders"));const L=s.docs.map(d=>d.data()).sort((a,b)=>(b.ts||0)-(a.ts||0));
 $("ol").innerHTML=L.length?L.map(o=>`<div class="it" style="display:block"><b>${esc(o.id)}</b> <small>${esc(o.d)}</small><br>
  ${esc(o.n)} · ${esc(o.ph)}<br><small>${esc(o.l)} · ${esc(o.pay)}</small><br><small>${(o.items||[]).map(esc).join("<br>")}</small><br><b>GH₵ ${esc(o.total)}</b>
  <select data-o="${esc(o.id)}">${STS.map(x=>`<option ${x===o.st?"selected":""}>${x}</option>`).join("")}</select></div>`).join(""):`<p class="m">No orders yet.</p>`;
}
$("ol").onchange=async e=>{const id=e.target.dataset.o;if(id)await updateDoc(doc(db,"orders",id),{st:e.target.value})};
</script></body></html>
